
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f3;
        }

        .login-box {
            width: 350px;
            max-width: calc(100% - 60px);
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #15966b;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #15966b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .message {
            color: #c62828;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Student Login</h2>
    <p style="text-align:center;">Welcome to Student Portal</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Register Number</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

    </form>

    <div class="links">
        <a href="{{ url_for('register_student') }}">New Student? Register Here</a>
        <br>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>

</div>

</body>
</html>
