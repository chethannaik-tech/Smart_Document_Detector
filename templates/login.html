<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eff6ff;
            padding: 30px;
        }
        .card {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Welcome to University Portal</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input name="username" placeholder="Register number or username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p><a href="{{ url_for('register') }}">Student Registration</a></p>
</div>
</body>
</html>
