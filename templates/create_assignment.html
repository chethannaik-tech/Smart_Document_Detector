
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Assignment - University Portal</title>
    <style>
        body { font-family: Arial; background: #f1f5f9; padding: 25px; color: #1e293b; }
        .card { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 3px 10px #0001; }
        input, textarea, select { width: 100%; padding: 12px; margin: 9px 0 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button, .btn { background: #2563eb; color: white; padding: 12px 16px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
        label { font-weight: bold; }
        .note { color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Create Assignment</h1>
    <p class="note">Only teachers can create assignments. The assignment will be visible to students in the selected semester.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
        <label>Assignment Title</label>
        <input name="title" placeholder="Enter assignment title" required>

        <label>Description / Instructions</label>
        <textarea name="description" rows="4" placeholder="Enter instructions"></textarea>

        <label>Subject Name</label>
        <input name="subject" placeholder="Example: Database Management System" required>

        <label>Department</label>
        <input name="department" placeholder="Example: CSE" required>

        <label>Semester</label>
        <select name="semester" required>
            <option value="">Select semester</option>
            {% for n in range(1,9) %}
            <option value="{{ n }}">Semester {{ n }}</option>
            {% endfor %}
        </select>

        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <label>Submission Deadline</label>
        <input type="date" name="end_date" required>

        <label>Maximum PDF Pages</label>
        <input type="number" name="max_pages" value="20" min="1" required>

        <label>Maximum Marks</label>
        <input type="number" name="max_marks" value="100" min="1" step="0.5" required>

        <label>Similarity Threshold (%)</label>
        <input type="number" name="similarity_threshold" value="50" min="0" max="100" step="0.1" required>

        <label>Reference PDF (Optional)</label>
        <input type="file" name="reference_file" accept=".pdf">
        <p class="note">PDF only. Maximum upload size: 50 MB.</p>

        <button type="submit">Create Assignment</button>
        <a class="btn" href="{{ url_for('teacher_dashboard') }}">Back</a>
    </form>
</div>
</body>
</html>
